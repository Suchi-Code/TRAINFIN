<script>
/* ============================================================
   HELPERS
   ============================================================ */
const TH_MON_LONG  = ['','มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน',
                       'กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const TH_MON_SHORT = ['','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

function fmtDate(d, short){
  if(!d) return '';
  const p = d.split('-');
  if(p.length!==3) return d;
  const mon = short ? TH_MON_SHORT[parseInt(p[1])] : TH_MON_LONG[parseInt(p[1])];
  return `${parseInt(p[2])} ${mon} ${parseInt(p[0])+543}`;
}
function fmtDateRange(s, e){
  if(!s && !e) return '';
  if(!e || s===e) return fmtDate(s);
  const ps = s.split('-'), pe = e.split('-');
  if(ps.length===3 && pe.length===3){
    const dS=parseInt(ps[2]), mS=parseInt(ps[1]), yS=parseInt(ps[0])+543;
    const dE=parseInt(pe[2]), mE=parseInt(pe[1]), yE=parseInt(pe[0])+543;
    if(yS===yE && mS===mE){
      // เดือน/ปีเดียวกัน → "20 - 21 กรกฎาคม 2569"
      return `${dS} - ${dE} ${TH_MON_LONG[mS]} ${yS}`;
    } else if(yS===yE){
      // ปีเดียวกัน คนละเดือน → "28 มิถุนายน - 2 กรกฎาคม 2569"
      return `${dS} ${TH_MON_LONG[mS]} - ${dE} ${TH_MON_LONG[mE]} ${yS}`;
    }
  }
  // คนละปี → แสดงเต็มทั้งสองฝั่ง
  return fmtDate(s) + ' – ' + fmtDate(e);
}
function fmtMoney(n){
  const v = parseFloat(n)||0;
  return v.toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtMoney2(n){
  const v = parseFloat(n)||0;
  return v===0 ? '-' : v.toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
}
const gv = id => (document.getElementById(id)?.value?.trim()||'');
const thaiNum = s => String(s ?? '').replace(/\d/g, d => '๐๑๒๓๔๕๖๗๘๙'[d]);

function toISODate(v){
  if(!v) return '';

  // 1. ถ้าเป็น Date Object อยู่แล้ว
  if(v instanceof Date && !isNaN(v)) {
    return v.getFullYear() + '-' + String(v.getMonth()+1).padStart(2,'0') + '-' + String(v.getDate()).padStart(2,'0');
  }

  const s = String(v).trim();
  if(!s) return '';

  // 2. ถ้าเป็นวันที่เพียวๆ รูปแบบ YYYY-MM-DD (เช่น "2026-07-01") แบบนี้ดึงใช้ได้เลย ไม่ติดเรื่อง Time Zone
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) {
    return s;
  }

  // 3. กรณี D/M/YYYY หรือ DD/MM/YYYY (รวมถึง พ.ศ.)
  const dmy = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if(dmy){
    const d = dmy[1].padStart(2,'0');
    const m = dmy[2].padStart(2,'0');
    let y = parseInt(dmy[3]);
    if(y > 2400) y -= 543;  // เผื่อเป็น พ.ศ.
    return `${y}-${m}-${d}`;
  }

  // 4. ถ้ามี ISO String / เวลาติดมาด้วย (เช่น "2026-06-30T17:00:00.000Z")
  // ให้ใช้ Date object ช่วยแปลง Time Zone กลับเป็น Local Time (เวลาไทย) ก่อนดึงวันที่
  const parsed = new Date(s);
  if(!isNaN(parsed.getTime())){
    return parsed.getFullYear() + '-' + String(parsed.getMonth()+1).padStart(2,'0') + '-' + String(parsed.getDate()).padStart(2,'0');
  }

  return '';
}

/* ============================================================
   หมวดรายการ — ต้องตรงกับ SEC_OPTS / DYNAMIC_SEC_ORDER ในไฟล์ 06
   ใช้สำหรับ (1) ตั้งชื่อหัวข้อกลุ่มตามหมวดที่ติ๊ก ว.119 จริง
             (2) คำนวณเลขข้อ "1., 2., 3. ..." ให้ตรงกับรายงานสรุป (ไฟล์ 06)
   ============================================================ */
const SEC_OPTS = [
  {v:'fuel',  l:'ค่าน้ำมันเชื้อเพลิงและหล่อลื่น'},
  {v:'1',     l:'ค่าวัสดุสำนักงาน'},
  {v:'2',     l:'ค่าวัสดุเบ็ดเตล็ด'},
  {v:'lump',  l:'ค่าจ้างเหมา (รถตู้/พาหนะรับจ้าง)'},
  {v:'venue', l:'ค่าเช่าสถานที่'},
  {v:'3',     l:'ค่าอาหารและเครื่องดื่ม'},
  {v:'4',     l:'ค่าเดินทางเจ้าหน้าที่ดำเนินการและประสานงาน (กฝภ.1)'},
  {v:'ext',   l:'ค่าสมนาคุณวิทยากรภายนอก'},
  {v:'int',   l:'ค่าสมนาคุณวิทยากรภายใน (จ่ายผ่าน payroll)'},
];
const DYNAMIC_SEC_ORDER = ['fuel','1','2','lump','venue','3','4','ext','int'];

// toggle หมวดจากไฟล์ 05 (budget.spkJson) — ใช้ตัดสินว่าหมวดไหน "ตั้งงบประมาณไว้" เพื่อคำนวณเลขข้อให้ตรงกับรายงานสรุป
let BUDGET05_TOGGLES = null;

/* หมวดที่ "ตั้งงบประมาณไว้" ตามไฟล์ 05 — ถ้ายังไม่มีข้อมูลงบ fallback ไปใช้หมวดที่มีรายการจริงในชุดข้อมูลที่ส่งเข้ามา */
function getActiveSections(rows){
  const t = BUDGET05_TOGGLES;
  if (t) {
    const set = new Set();
    if (t.fuel && t.fuel.on) set.add('fuel');
    if (!t.toggles || t.toggles.office !== false) set.add('1');
    if (!t.toggles || t.toggles.misc   !== false) set.add('2');
    if (t.lump  && t.lump.on)  set.add('lump');
    if (t.venue && t.venue.on) set.add('venue');
    if (!t.toggles || t.toggles.food        !== false) set.add('3');
    if (!t.toggles || t.toggles.stafftravel !== false) set.add('4');
    if (t.hasExternal !== false && Array.isArray(t.EXT) && t.EXT.length > 0) set.add('ext');
    const intHasSpeakers = Array.isArray(t.INT) && t.INT.length > 0;
    if (t.hasInternal || intHasSpeakers || (rows||[]).some(r=>r.sec==='int')) set.add('int');
    return set;
  }
  return new Set((rows||[]).map(r=>r.sec));
}

// คำนวณเลขข้อ "1., 2., 3..." แบบ dynamic ตามลำดับ DYNAMIC_SEC_ORDER — ต้องให้ผลลัพธ์ตรงกับไฟล์ 06
function computeMajorNumbers(rows){
  const present = getActiveSections(rows);
  const nums = {};
  let n = 0;
  DYNAMIC_SEC_ORDER.forEach(sec=>{
    if(present.has(sec)){ n++; nums[sec] = String(n); }
  });
  return nums;
}

// เลขข้อของแต่ละหมวด คำนวณครั้งเดียวตอนโหลดข้อมูล (key = sec, value = "1"/"2"/...)
let SECTION_NUMS = {};

async function gsApi(action, data, no) {
  try {
    let url = GAS_URL + '?action=' + action;
    if (no) url += '&no=' + encodeURIComponent(no);
    const opts = data
      ? { method: 'POST', body: new URLSearchParams({ action, data: JSON.stringify(data) }) }
      : { method: 'GET' };
    const res = await fetch(url, opts);
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || 'API error');
    return json.data;
  } catch(e) {
    console.warn('gsApi error:', e);
    return null;
  }
}

    console.log('[09] gsRow:', gsRow);
    if(!gsRow){
      _hideLoader09();
      _showStatus09('⚠️ ไม่พบข้อมูลสำหรับเลขที่ ' + no, 'warn');
      document.getElementById('doc-display').innerHTML =
        '<div style="text-align:center;padding:40px;color:#888">⚠️ ไม่พบข้อมูลสำหรับเลขที่หลักสูตร ' + esc(no) + '</div>';
      return;
    }

    const cr = gsRow.course   || {};
    const g6 = gsRow.actual06 || {};
    const bd = gsRow.budget   || null;

    // ── parse toggle หมวดจากไฟล์ 05 (ถ้ามี) ไว้คำนวณเลขข้อให้ตรงกับรายงานสรุป ──
    BUDGET05_TOGGLES = null;
    if (bd && bd.spkJson) {
      try { BUDGET05_TOGGLES = typeof bd.spkJson === 'string' ? JSON.parse(bd.spkJson) : bd.spkJson; }
      catch(e) { BUDGET05_TOGGLES = null; }
    }

    // ── เติมข้อมูลหลักสูตรลง input-panel (read-only display) ──
    // วันที่: รองรับหลายตำแหน่งที่อาจมาจาก backend (cr.dateStart/dateEnd เป็นหลัก
    // แต่กันเหนียวกรณี backend ส่งมาที่ระดับบนสุดของ gsRow หรือใน actual06 แทน)
    const title    = cr.course    || '';
    const run      = cr.batch     || '';
    const runno    = cr.no        || no;
    const dateS    = toISODate(cr.dateStart || gsRow.dateStart || g6.dateStart || '');
    const dateE    = toISODate(cr.dateEnd   || gsRow.dateEnd   || g6.dateEnd   || '');
    const location = cr.location  || '';

    if(document.getElementById('f_title'))    document.getElementById('f_title').value    = title;
    if(document.getElementById('f_run'))      document.getElementById('f_run').value       = run;
    if(document.getElementById('f_runno'))    document.getElementById('f_runno').value     = runno;
    if(document.getElementById('f_date'))     document.getElementById('f_date').value      = dateS;
    if(document.getElementById('f_date_end')) document.getElementById('f_date_end').value  = dateE;
    if(document.getElementById('f_location')) document.getElementById('f_location').value  = location;

    // ── กรองเฉพาะรายการที่ติ๊ก "ค่าใช้จ่ายตาม ว.119" (w119) จาก actual06.rowsJson ──
    // หมายเหตุ: ไฟล์ 06 บันทึกคอลัมน์ "rowsJson" เป็น JSON string (ไม่ใช่ "rows")
    // ต้อง parse ก่อนใช้งาน และรองรับกรณี backend คืนมาเป็น array อยู่แล้ว
    let allRows = [];
    const rawRows = g6.rowsJson ?? g6.rows ?? [];
    if(typeof rawRows === 'string'){
      try{ allRows = JSON.parse(rawRows || '[]'); }catch(e){ allRows = []; console.warn('[09] rowsJson parse error:', e); }
    } else if(Array.isArray(rawRows)){
      allRows = rawRows;
    }

    // เลขข้อ "1., 2., 3..." คำนวณจากหมวดที่ตั้งงบไว้ทั้งหมด (ไม่ใช่แค่ที่ติ๊ก ว.119) เพื่อให้ตรงกับรายงานสรุป (ไฟล์ 06)
    SECTION_NUMS = computeMajorNumbers(allRows);

    editRows = allRows.filter(r=>r.w119===true || r.w119==='true').map(r=>{
      // กันเหนียว: ใช้ staff เฉพาะตอนเป็นหมวด 4 (เจ้าหน้าที่) เท่านั้น
      // ป้องกัน bug เดิมจากไฟล์ 06 ที่ select เจ้าหน้าที่ติดค่า default มาทุกแถว
      const nameVal = r.name || (String(r.sec)==='4' ? (r.staff||'') : '');
      const secLabel = (SEC_OPTS.find(s=>s.v===r.sec)?.l) || '';
      return {
        sec   : r.sec    || '',
        secNum: SECTION_NUMS[r.sec] || '',
        secLabel,
        doc   : r.doc    || '',
        name  : nameVal,
        branch: r.branch || '',
        addr  : r.addr   || buildAddr(r),
        taxid : r.taxid  || '',
        date  : r.date   || '',
        acct  : r.acct   || '',
        val   : parseFloat(r.val)   || 0,
        vat   : parseFloat(r.vat)   || 0,
        wht   : parseFloat(r.wht)   || 0,
        total : parseFloat(r.total) || ((parseFloat(r.val)||0)+(parseFloat(r.vat)||0)-(parseFloat(r.wht)||0)),
      };
    });

    _hideLoader09();
    if(editRows.length===0){
      _showStatus09('⚠️ ไม่พบรายการ "ค่าใช้จ่ายตาม ว.119"', 'warn');
    } else {
      _showStatus09('✅ โหลดข้อมูลสำเร็จ', 'ok');
    }

    renderDocDisplay();
  }catch(e){
    _hideLoader09();
    _showStatus09('❌ โหลดไม่สำเร็จ: ' + e.message, 'error');
    console.error('[09] loadFromGSheet09 error:', e);
  }
}

function autoLoadFromFile01(){

    if(raw) slot = JSON.parse(raw);

/* ============================================================
   BUILD PRINT DOCUMENT HTML
   ============================================================ */
function buildDocHtml(){
  const title    = gv('f_title');
  const run      = gv('f_run');
  const runno    = gv('f_runno');
  const dateStr  = fmtDateRange(gv('f_date'), gv('f_date_end'));
  const location = gv('f_location');

  // จัดเรียงแถวตามลำดับหมวดของ DYNAMIC_SEC_ORDER ก่อน (ให้กลุ่มหมวดเรียงตรงกับรายงานสรุป)
  // แล้วค่อยเลขลำดับที่ต่อเนื่องกันทั้งชุด
  const secOrderIdx = sec => { const i = DYNAMIC_SEC_ORDER.indexOf(sec); return i===-1 ? 999 : i; };
  const sortedRows = [...editRows].sort((a,b)=> secOrderIdx(a.sec)-secOrderIdx(b.sec));

  const rows = sortedRows.map((r,i)=>({
    seq   : i+1,
    sec   : r.sec||'',
    secNum: r.secNum||'',
    secLabel: r.secLabel||'',
    doc   : r.doc||'',
    name  : r.name||'',
    branch: r.branch||'',
    addr  : r.addr||'',
    taxid : r.taxid||'',
    date  : r.date||'',
    acct  : r.acct||'',
    val   : r.val||0,
    vat   : r.vat||0,
    wht   : r.wht||0,
    total : r.total||0,
  }));

  let gVal=0,gVat=0,gWht=0,gTotal=0;
  rows.forEach(r=>{gVal+=r.val;gVat+=r.vat;gWht+=r.wht;gTotal+=r.total;});

  // ซ่อนคอลัมน์ "ภาษีหัก ณ ที่จ่าย" ทั้งคอลัมน์ ถ้าไม่มีรายการใดมีค่าเลย (0 หรือไม่ระบุ)
  const hasWht = rows.some(r => (parseFloat(r.wht)||0) > 0);
  const colCount = hasWht ? 7 : 6;
  const itemColWidth = hasWht ? 44 : 54;

  /* ---- แถวข้อมูล (แทรกหัวข้อหมวดตามที่ติ๊ก ว.119 จริง) ---- */
  let bodyHtml='';
  if(rows.length===0){
    bodyHtml=`<tr><td colspan="${colCount}" style="text-align:center;padding:16px;color:#888;font-style:italic;">ไม่มีรายการ</td></tr>`;
  } else {
    let lastSec = null;
    rows.forEach(r=>{
      if(r.sec !== lastSec){
        const num = r.secNum ? r.secNum + '. ' : '';
        bodyHtml += `<tr class="row-sub"><td colspan="${colCount}">${num}${r.secLabel} (ว.119)</td></tr>`;
        lastSec = r.sec;
      }
      const detailLines=[];
      if(r.doc)    detailLines.push(r.doc);
      if(r.name)   detailLines.push(r.name);
      if(r.branch) detailLines.push(r.branch);
      if(r.taxid)  detailLines.push('เลขประจำตัวผู้เสียภาษี '+r.taxid);
      if(r.addr)   detailLines.push(r.addr);
      if(r.date)   detailLines.push('ลงวันที่ '+fmtDate(r.date));
      bodyHtml+=`<tr>
        <td class="tc">${r.seq}</td>
        <td class="tl" style="line-height:1.55">${detailLines.map(l=>`<div>${l}</div>`).join('')}</td>
        <td class="tc">${r.acct}</td>
        <td class="tr">${fmtMoney(r.val)}</td>
        <td class="tr">${fmtMoney2(r.vat)}</td>
        ${hasWht ? `<td class="tr">${fmtMoney2(r.wht)}</td>` : ''}
        <td class="tr">${fmtMoney(r.total)}</td>
      </tr>`;
    });
  }

  return `<div class="doc-wrap">
<div class="doc-title">
  <input class="hdr-inp" id="ph_title" value="">
  <input class="hdr-inp" id="ph_title" value="รายละเอียดค่าใช้จ่ายกรณีจัดซื้อ / จัดจ้างพัสดุ">
  <input class="hdr-inp" id="ph_title" value="${thaiNum('ที่เกี่ยวกับค่าใช้จ่ายในการบริหารงานที่มีวงเงินฯ ครั้งละไม่เกิน 10,000 บาท')}">
</div>
<div class="doc-meta">
  <input class="hdr-inp" id="ph_line1" value='หลักสูตร "${title}" รุ่นที่ ${thaiNum(run)}'>
  <input class="hdr-inp" id="ph_line2" value="เลขที่รุ่นหลักสูตร ${thaiNum(runno)}${dateStr?' ในวันที่ '+thaiNum(dateStr):''}">
  <input class="hdr-inp" id="ph_line3" value="${location?'ณ '+location:''}">
  <input class="hdr-inp" id="ph_line4" value="">
</div>

<table class="doc-table">
  <thead>
    <tr>
      <th style="width:6%">ลำดับที่</th>
      <th style="width:${itemColWidth}%" class="tl">รายการ</th>
      <th style="width:10%">รหัสบัญชี</th>
      <th style="width:10%">มูลค่าสินค้า</th>
      <th style="width:10%">ภาษีมูลค่าเพิ่ม</th>
      ${hasWht ? '<th style="width:10%">ภาษีหัก ณ ที่จ่าย</th>' : ''}
      <th style="width:10%">จำนวนเงิน</th>
    </tr>
  </thead>
  <tbody>
    <tr class="row-cat">
      <td colspan="${colCount}">ก. ค่าดำเนินการฝึกอบรม</td>
    </tr>
    ${bodyHtml}
    <tr class="row-grand">
      <td colspan="3" class="tc">รวมค่าใช้จ่ายตาม ว.119 ทั้งสิ้น</td>
      <td class="tr">${fmtMoney(gVal)}</td>
      <td class="tr">${fmtMoney2(gVat)}</td>
      ${hasWht ? `<td class="tr">${fmtMoney2(gWht)}</td>` : ''}
      <td class="tr">${fmtMoney(gTotal)}</td>
    </tr>
  </tbody>
</table>
</div>`;
}

const PDF_SERVER_URL = 'https://trainfin.onrender.com/generate-pdf';

// ===== Supabase (สำหรับอัปโหลด PDF ที่สร้างเสร็จแล้วขึ้นเก็บถาวร) =====
const SUPABASE_URL = 'https://dcaydbxyjisegqzzildq.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRjYXlkYnh5amlzZWdxenppbGRxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2OTk5NDgsImV4cCI6MjEwMDI3NTk0OH0.cEk8k90NeTTnkZV0Sny7nuN8UbW15_eW8S_HTQSBwwA';
const supabaseClient = (typeof window.supabase !== 'undefined')
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

// อัปโหลด PDF ขึ้น Supabase Storage (bucket: pdfs) — คืนค่า public URL หรือ null ถ้าไม่สำเร็จ
async function uploadPdfToSupabase09(pdfBlob, fname){
  if(!supabaseClient){ console.warn('Supabase client ยังไม่พร้อม (โหลด SDK ไม่สำเร็จ)'); return null; }
  try {
    const asciiSafe = fname
      .replace(/[^\w.\-]+/g, '_')
      .replace(/_+/g, '_')
      .replace(/^_|_$/g, '') || 'report';
    const fileName = `${asciiSafe}-${Date.now()}.pdf`;
    const pdfFile  = new File([pdfBlob], fileName, { type: 'application/pdf' });
    const { error: uploadError } = await supabaseClient
      .storage.from('pdfs')
      .upload(fileName, pdfFile, { cacheControl: '3600', upsert: true });
    if(uploadError) throw uploadError;
    const { data } = supabaseClient.storage.from('pdfs').getPublicUrl(fileName);
    return data.publicUrl;
  } catch(err){
    console.error('uploadPdfToSupabase09 error:', err);
    return null;
  }
}

async function savePdf(btn){
  const el = document.getElementById('doc-display');
  if(!el || !el.innerHTML.trim()){ alert('ไม่พบข้อมูลเอกสาร'); return; }

  const title = gv('f_title') || 'ค่าวัสดุเบ็ดเตล็ด';
  const run   = gv('f_run')   || '';
  const runno = gv('f_runno') || '';
  const safe  = s => s.replace(/[/\\:*?"<>|]/g,'_').trim();
  const fname = safe(`วัสดุเบ็ดเตล็ด_${title}_รุ่น${run}_${runno}`) || 'sec2_misc';

  btn.disabled = true; btn.textContent = '⏳ กำลังสร้าง...';

  try {
    const clone = el.cloneNode(true);

    /* เอากรอบเทาจาง/padding/background ของ #doc-display (สำหรับแสดงผลบนหน้าจอ) ออก
       ไม่ให้ติดไปใน PDF */
    clone.style.border       = 'none';
    clone.style.borderRadius = '0';
    clone.style.background   = 'transparent';
    clone.style.padding      = '0';
    clone.style.margin       = '0';
    clone.style.boxShadow    = 'none';

    /* แปลง input.hdr-inp → div (คงหน้าตาเดิม ตัดเส้นประ/พื้นหลังของ input ออก) */
    clone.querySelectorAll('input.hdr-inp').forEach(inp => {
      const d = document.createElement('div');
      d.style.cssText = 'font-family:Sarabun,sans-serif;font-size:13px;font-weight:700;color:#000;text-align:center;line-height:1.7;width:100%;';
      d.textContent = inp.value;
      inp.parentNode.replaceChild(d, inp);
    });

    // ✅ ดึง CSS หลักของหน้าเว็บทั้งดวง (นิยาม .doc-wrap, .doc-table, .row-sub ฯลฯ) ไปแนบด้วย
    // ไม่งั้นฝั่ง server ไม่รู้จัก class เหล่านี้ ตารางจะไม่มีเส้นขอบ/จัดหน้าตามที่ตั้งใจ
    const originalStyles = Array.from(document.querySelectorAll('style'))
      .map(s => s.innerHTML).join('\n');

    // ประกอบเป็นเอกสาร HTML ฉบับสมบูรณ์ ส่งให้ฝั่งเซิร์ฟเวอร์ (Puppeteer) เปิดแล้ว render เป็น PDF จริง
    const fullHtml = `<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
${originalStyles}
</style>
<style>
  /* Override เฉพาะสำหรับไฟล์ PDF (มาทีหลัง จึงมีลำดับความสำคัญสูงกว่า CSS หลักด้านบน) */
  * { box-sizing: border-box; }
  html,body { margin:0; padding:0; background:#fff; font-family:'Sarabun',sans-serif; color:#000; }
  table.doc-table{ page-break-inside:auto; }
  table.doc-table tr{ page-break-inside:avoid; page-break-after:auto; }
</style>
</head>
<body>${clone.outerHTML}</body>
</html>`;

    const res = await fetch(PDF_SERVER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        html: fullHtml,
        filename: fname,
        // ✅ pdfOptions เฉพาะของไฟล์ 09 — บันทึก PDF ที่สเกลหน้ากระดาษ 100%
        pdfOptions: {
          format: 'A4',
          landscape: false,
          scale: 1,
          margin: { top: '12mm', right: '12mm', bottom: '10mm', left: '12mm' },
          preferCSSPageSize: true,
          printBackground: true,
        },
      })
    });
    if(!res.ok){
      const errText = await res.text().catch(()=>res.statusText);
      throw new Error(`เซิร์ฟเวอร์สร้าง PDF ผิดพลาด (${res.status}): ${errText}`);
    }

    const blob = await res.blob();
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = fname + '.pdf';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);

    // อัปโหลดขึ้น Supabase เก็บถาวรด้วย (ไม่บล็อกการดาวน์โหลดในเครื่อง ถ้าอัปโหลดไม่สำเร็จ
    // ผู้ใช้ก็ยังได้ไฟล์ในเครื่องตามปกติ แค่ไม่มีลิงก์ถาวรเก็บไว้)
    const publicUrl = await uploadPdfToSupabase09(blob, fname);
    if (publicUrl) {
      console.log('อัปโหลด PDF ขึ้น Supabase สำเร็จ:', publicUrl);
      const courseNo = window.__courseNo09 || '';
      if (courseNo) {
        try {
          await gsApi('updatePdfUrl', {
            no: courseNo, pdf09: publicUrl,
            pdf09SavedAt: new Date().toISOString(), sheetName: 'courses'
          });
        } catch(e) { console.warn('บันทึกลิงก์ PDF 09 ไม่สำเร็จ:', e); }
      }
    }

  } catch(err){
    console.error('savePdf error:', err);
    alert('สร้าง PDF ไม่สำเร็จ: ' + err.message + '\n\nตรวจสอบว่าตั้งค่า PDF_SERVER_URL ถูกต้อง และเซิร์ฟเวอร์ Puppeteer เปิดใช้งานอยู่');
  } finally {
    btn.disabled = false; btn.textContent = '💾 บันทึก PDF';
  }
}
</script>
