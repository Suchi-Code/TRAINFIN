<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แอดมินสั่งเครื่องดื่ม</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/auth.js"></script>
<script src="js/permissions.js"></script>
<script src="js/sidebar.js"></script>
<script>checkAuth();</script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--navy:#092c4c;--blue:#0b6aab;--sky:#eaf4fb;--line:#dce5ec;--ink:#1b2a38;--muted:#627587;--green:#197a5d;--amber:#bf7800;--purple:#7865c8;--red:#c0364f;--red-bg:#fdeeea;--green-bg:#eafaf5;--bg:#f3f6f8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Prompt',sans-serif;font-size:14px;line-height:1.55}
/* ===== PWA layout (ตาม Sidebar-Page-Guide.md §3) ===== */
.layout{display:flex;min-height:100vh}
.sidebar{position:sticky;top:0;align-self:flex-start;height:100vh;width:260px;flex:0 0 260px;background:var(--navy);color:#dce8f2;padding:20px 16px;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;transition:width .22s ease,flex-basis .22s ease,padding .22s ease}
.sidebar.collapsed{width:76px;flex-basis:76px;padding-left:12px;padding-right:12px}
.main{width:calc(100% - 260px);max-width:calc(100% - 260px);padding:30px 34px 42px;min-width:0;transition:width .22s ease,max-width .22s ease;overflow-x:hidden}
.main.wide{width:calc(100% - 76px);max-width:calc(100% - 76px)}
.sidebar-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:0 6px 20px;border-bottom:1px solid rgba(255,255,255,.15)}
.brand{display:flex;align-items:center;gap:11px;min-width:0;overflow:hidden}
.sidebar .mark{height:37px;width:37px;flex:0 0 37px;border-radius:10px;object-fit:cover;background:#fff}
.brand-text{min-width:0}
.brand b{display:block;color:#fff;font-size:15px;white-space:nowrap}
.brand span{font-size:10.5px;color:#a9c3d6;white-space:normal;line-height:1.3;display:block}
.nav{padding-top:20px}
.nav-label{font-size:11px;letter-spacing:.08em;color:#82a4bd;padding:0 12px 10px;white-space:nowrap;overflow:hidden}
.nav a{display:flex;align-items:center;gap:12px;text-decoration:none;color:#c9dae7;padding:12px;border-radius:8px;margin:3px 0;transition:.15s;white-space:nowrap;overflow:hidden}
.nav a:hover{background:rgba(255,255,255,.08)}
.nav a.active{background:#1275b4;color:#fff;font-weight:700;box-shadow:inset 3px 0 #91d8ff}
.nav svg{width:19px;height:19px;flex:0 0 19px;fill:none;stroke:currentColor;stroke-width:1.8}
.user{margin-top:auto;background:rgba(255,255,255,.07);padding:13px;border-radius:9px;font-size:12px;overflow:hidden;white-space:nowrap;flex:0 0 auto}
.user b{color:#fff;display:block;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis}
.user span{color:#a9c3d6}
.sidebar-toggle{flex:0 0 26px;width:26px;height:26px;background:transparent;border:0;color:#cfe0ee;cursor:pointer;display:grid;place-items:center;transition:.15s;margin-top:2px;padding:0}
.sidebar-toggle:hover{color:#fff}
.sidebar-toggle svg{width:16px;height:16px;stroke:currentColor;stroke-width:2.2;transition:transform .22s ease}
.sidebar-toggle.collapsed svg{transform:rotate(180deg)}
.sidebar.collapsed .sidebar-head{flex-direction:column;align-items:center;gap:12px;padding-left:0;padding-right:0}
.sidebar.collapsed .brand{justify-content:center}
.sidebar.collapsed .brand-text,.sidebar.collapsed .nav-label,.sidebar.collapsed .user{display:none}
.sidebar.collapsed .nav a{justify-content:center;padding-left:8px;padding-right:8px}
.sidebar.collapsed .nav a span{display:none}
@media(max-width:1050px){.main{padding:22px;width:calc(100% - 215px);max-width:calc(100% - 215px)}.sidebar{width:215px;flex-basis:215px}}
@media(max-width:720px){.sidebar{display:none}.main{width:100%;max-width:100%;padding:18px}}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}
.topbar h1{margin:0;font-size:22px;color:var(--navy)}
.topbar p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.card{overflow-x:auto}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
h2{margin:0 0 10px;font-size:18px;color:var(--navy)}
h3{margin:0 0 8px;font-size:15px;color:var(--navy)}
.muted{color:var(--muted);font-size:13px}
.btn{border:none;border-radius:8px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer;background:var(--blue);color:#fff}
.btn:hover{filter:brightness(.92)} .btn:disabled{background:#b8c4d0;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.btn.red{background:#fdeeea;color:var(--red);border:1px solid #f3c7cf}
.btn.green{background:var(--green)}
.btn.sm{padding:4px 10px;font-size:13px}
input[type=text],input[type=password],input[type=date],input[type=datetime-local],textarea,select{width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font:inherit;background:#fff}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--blue)}
label.f{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
.tab{padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600;color:var(--muted)}
.tab.on{background:var(--blue);border-color:var(--blue);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.stat{background:#f7fafc;border:1px solid var(--line);border-radius:10px;padding:12px}
.stat .n{font-size:26px;font-weight:700;color:var(--navy);line-height:1.2}
.stat .l{font-size:12px;color:var(--muted)}
.stat.click{cursor:pointer;border-color:#9fc6e0}
.stat.click:hover{background:#eef6fc}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--navy);color:#fff;padding:8px 10px;text-align:left;white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid #eef1f4;vertical-align:middle}
.tag{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap;display:inline-block}
.grp{margin:18px 0 6px;font-size:14px;font-weight:700;color:var(--navy)} .grp .n{color:var(--muted);font-weight:400}
tr.ended td{background:#f6f7f9;color:var(--muted)} tr.ended td b{color:var(--muted);font-weight:600} tr.ended .btn{opacity:.75}
.tag.ok{background:#e3f7ee;color:#178a5c} .tag.no{background:#fdeeea;color:var(--red)} .tag.wait{background:#fff2d8;color:#8a5700} .tag.gray{background:#eef0f4;color:var(--muted)}
.chip{display:inline-block;background:#eef5ff;color:var(--blue);border-radius:99px;padding:2px 10px;margin:2px 4px 2px 0;font-size:13px;font-weight:600}
.err{background:#fdeeea;color:var(--red);border:1px solid #f3c7cf;border-radius:8px;padding:10px;margin:10px 0}
.warn{background:#fff6e0;color:#8a5700;border:1px solid #f0dca8;border-radius:8px;padding:10px;margin:10px 0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:10px 20px;border-radius:8px;z-index:99;font-weight:600}
.linkbox{background:#f0f4f8;border:1px dashed #9fb4c8;border-radius:8px;padding:10px;word-break:break-all;font-size:13px}
.hide{display:none}
.daybar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.daybar input[type=date]{width:auto}
.modal{position:fixed;inset:0;background:rgba(15,39,68,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:90}
.modal .box{background:#fff;border-radius:12px;padding:18px;width:100%;max-height:90vh;overflow:auto}
#printArea{display:none}
.stkgrid{display:grid;gap:0}
.stk{border:1px dashed #666;padding:3mm 4mm;min-height:28mm;break-inside:avoid;page-break-inside:avoid;line-height:1.25;overflow:hidden}
.stk .n{font-size:15pt;font-weight:700}.stk .m{font-size:13pt;font-weight:600}.stk .s{font-size:12pt}.stk .t{font-size:10pt;font-style:italic}.stk .g{font-size:8pt;color:#444;margin-top:1mm}
@media print{@page{size:A4;margin:8mm}body{background:#fff}.layout,.toast,.modal{display:none!important}#printArea{display:block!important}}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="layout">
  <div id="sidebarRoot"></div>
  <script>renderSidebar('training-support');</script>
  <main class="main">
    <header class="topbar"><div><h1>🥤 แอดมินสั่งเครื่องดื่ม</h1><p>การประปาส่วนภูมิภาค · กฝภ.1 · ระบบงานฝึกอบรม</p></div><div id="hRight"></div></header>
    <div id="app"><div class="card muted">กำลังโหลด...</div></div>
  </main>
</div>

<script>
/* ===== Supabase (บัญชีและสิทธิ์ชุดเดียวกับ exam-admin) ===== */
const sb = window.supabase.createClient(APP_CONFIG.SUPABASE_URL, APP_CONFIG.SUPABASE_ANON_KEY);

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtT = t => t ? new Date(t).toLocaleString('th-TH', { dateStyle: 'short', timeStyle: 'short' }) : '';
const fmtHM = t => t ? new Date(t).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) : '';
function toast(m){ const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
function thaiDate(iso, style){
  const [y, m, d] = String(iso || '').split('-').map(Number);
  if(!y) return '';
  return new Date(y, m - 1, d).toLocaleDateString('th-TH', { dateStyle: style || 'full' });
}

/* ===== state ===== */
let user = null, view = 'events', tab = 'dash';
let events = [], cur = null;
let menu = [], sweet = [];
let people = [], orders = [], examSessions = [];
let todayStr = '';
const TEMPS = ['ร้อน', 'เย็น'];
const GROUPS = ['ผู้เข้าอบรม', 'เจ้าหน้าที่', 'วิทยากร', 'สังเกตการณ์', 'อื่นๆ'];
let openUndeliv = false, onlyUndeliv = false;
let openPending = false, editingMenu = null, editingSweet = null, editingPerson = null, pSearch = '';
let channel = null, pollTimer = null, reloadTimer = null, rtStatus = '';

/* ===== boot — ใช้ session + role ของระบบ PWA (ไม่มีหน้า login แยกแล้ว) ===== */
async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session) return;                     // checkAuth() เด้งกลับหน้า login ให้แล้ว
  user = session.user;
  await loadCurrentUser();                 // เติมชื่อใน sidebar + cache role ลง sessionStorage
  if(!canEditThisPage(getCurrentRole())){ viewNoAccess(); return; }
  const r = await sb.rpc('drink_today');
  todayStr = (r && r.data) ? String(r.data) : new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Bangkok' });
  await go('events');
}
function viewNoAccess(){
  $('app').innerHTML = `<div class="card" style="max-width:520px;margin:30px auto;text-align:center">
    <div style="font-size:42px">🔒</div><h2>ไม่มีสิทธิ์เข้าใช้งานหน้านี้</h2>
    <p class="muted">หน้านี้สำหรับผู้ดูแลระบบ (admin) และผู้บริหาร (manager) เท่านั้น<br>หากต้องการใช้งาน กรุณาติดต่อผู้ดูแลระบบเพื่อขอปรับสิทธิ์ แล้วออกจากระบบและเข้าสู่ระบบใหม่</p></div>`;
}

/* ===== โครงหน้า + เมนูนำทาง ===== */
function shell(){ $('app').innerHTML = '<div class="tabs" id="nav"></div><div id="view"></div>'; }
function renderNav(){
  $('nav').innerHTML = [['events', '📋 รายการสั่งน้ำ'], ['menu', '🥤 เมนูและความหวาน']].map(([k, l]) =>
    `<div class="tab ${(view === k || (view === 'detail' && k === 'events')) ? 'on' : ''}" onclick="go('${k}')">${l}</div>`).join('');
}
async function go(v){
  leaveEvent(); view = v; shell(); renderNav();
  $('view').innerHTML = '<div class="card muted">กำลังโหลด...</div>';
  if(v === 'events') await viewEvents(); else await viewMenuAdmin();
}

/* ===== รายการสั่งน้ำ ===== */
function evState(e){
  if(!e.is_open) return 'MANUAL';
  if(todayStr > e.order_date) return 'EXPIRED';
  if(e.close_at && Date.now() >= new Date(e.close_at).getTime()) return 'TIME';
  return 'OPEN';
}
function fmtClose(iso){ return new Date(iso).toLocaleString('th-TH', { dateStyle: 'short', timeStyle: 'short', timeZone: 'Asia/Bangkok' }); }
function stateTag(e){
  const s = evState(e);
  if(s === 'OPEN') return `<span class="tag ok">เปิดรับสั่ง${e.close_at ? ' · ปิด ' + esc(fmtClose(e.close_at)) : ''}</span>`;
  if(s === 'TIME') return '<span class="tag gray">หมดเวลารับสั่งแล้ว</span>';
  if(s === 'EXPIRED') return '<span class="tag gray">จบแล้ว</span>';
  return '<span class="tag gray">ปิดรับสั่ง</span>';
}
function dateLabel(d){
  return thaiDate(d, 'medium') + (d === todayStr ? ' (วันนี้)' : d > todayStr ? ' (ล่วงหน้า)' : '');
}
async function viewEvents(){
  const [ev, pp] = await Promise.all([
    sb.from('drink_events').select('*').order('order_date', { ascending: false }).order('created_at', { ascending: false }),
    sb.from('drink_people').select('event_id')]);
  if(ev.error){ $('view').innerHTML = `<div class="err">${esc(ev.error.message)}</div>`; return; }
  events = ev.data || [];
  const cnt = {}; (pp.data || []).forEach(x => { cnt[x.event_id] = (cnt[x.event_id] || 0) + 1; });
  const copyable = events.filter(e => cnt[e.id]);
  $('view').innerHTML = `<div class="card"><h2>สร้างรายการสั่งน้ำใหม่</h2>
      <div class="grid2" style="grid-template-columns:2fr 1fr 2fr auto;align-items:end">
        <div><label class="f">ชื่อรายการ *</label><input type="text" id="n_title" placeholder="เช่น อบรมหลักสูตร X รุ่น 2 (วันที่ 1)" onkeydown="if(event.key==='Enter')addEvent()"></div>
        <div><label class="f">วันที่สั่ง *</label><input type="date" id="n_date" value="${esc(todayStr)}"></div>
        <div><label class="f">คัดลอกรายชื่อจากรายการเดิม (ถ้าต้องการ)</label><select id="n_copy"><option value="">— ไม่คัดลอก —</option>` +
          copyable.map(e => `<option value="${esc(e.id)}">${esc(e.title)} · ${esc(thaiDate(e.order_date, 'short'))} · ${cnt[e.id]} คน</option>`).join('') +
        `</select></div>
        <button class="btn green" onclick="addEvent()" style="white-space:nowrap">＋ สร้าง</button></div>
      <p class="muted">1 รายการ = 1 วัน + ชุดรายชื่อ + 1 ลิงก์ · เลือกวันที่ล่วงหน้าได้ ผู้ใช้สั่งได้ตั้งแต่สร้างจนถึงสิ้นวันที่เลือก · อบรมหลายวันให้สร้างรายการแยกรายวัน (คัดลอกรายชื่อจากรายการเดิมได้)</p></div>
    <div class="card"><h2>รายการทั้งหมด</h2>` + (events.length ? drinkGroups(cnt) : '<p class="muted">ยังไม่มีรายการ</p>') + '</div>';
}
// ตารางรายการ แยก 2 กลุ่ม (รูปแบบเดียวกับหน้าแอดมินข้อสอบ): จบแล้ว = เลยวันที่ของรายการ
function drinkGroups(cnt){
  const rowHtml = e => {
    const ended = evState(e) === 'EXPIRED';
    return `<tr class="${ended ? 'ended' : ''}"><td>${esc(dateLabel(e.order_date))}</td><td><b>${esc(e.title)}</b></td>
      <td><span class="muted">${cnt[e.id] || 0} คน</span></td>
      <td>${stateTag(e)}</td><td><button class="btn sm" onclick="openEvent('${esc(e.id)}')">เปิด</button></td></tr>`;
  };
  const table = list => '<table><thead><tr><th>วันที่</th><th>ชื่อรายการ</th><th>รายละเอียด</th><th>สถานะ</th><th></th></tr></thead><tbody>' + list.map(rowHtml).join('') + '</tbody></table>';
  const act = events.filter(e => evState(e) !== 'EXPIRED'), done = events.filter(e => evState(e) === 'EXPIRED');
  return `<div class="grp">กำลังดำเนินการ <span class="n">(${act.length})</span></div>` + (act.length ? table(act) : '<p class="muted">ไม่มีรายการที่กำลังดำเนินการ</p>') +
    `<div class="grp">จบแล้ว <span class="n">(${done.length}) · เลยวันที่ของรายการแล้ว</span></div>` + (done.length ? table(done) : '<p class="muted">ยังไม่มีรายการที่จบ</p>');
}
async function addEvent(){
  const title = $('n_title').value.trim(), date = $('n_date').value, src = $('n_copy').value;
  if(!title){ toast('กรุณาใส่ชื่อรายการ'); return; }
  if(!date){ toast('กรุณาเลือกวันที่สั่ง'); return; }
  const { data, error } = await sb.from('drink_events').insert({ title, order_date: date }).select().single();
  if(error){ toast('ผิดพลาด: ' + error.message); return; }
  let copied = 0;
  if(src){
    const sp = await sb.from('drink_people').select('emp_id,full_name,unit,grp').eq('event_id', src);
    if(sp.data && sp.data.length){
      const r = await sb.from('drink_people').insert(sp.data.map(x => ({ emp_id: x.emp_id, full_name: x.full_name, unit: x.unit, grp: x.grp, event_id: data.id })));
      if(r.error) toast('สร้างรายการแล้ว แต่คัดลอกรายชื่อไม่สำเร็จ: ' + r.error.message); else copied = sp.data.length;
    }
  }
  await openEvent(data.id, copied ? 'set' : 'people');
  if(copied) toast('คัดลอกรายชื่อ ' + copied + ' คนแล้ว');
}

/* ===== เปิดรายการ + โหลดข้อมูล ===== */
async function openEvent(id, startTab){
  leaveEvent();
  view = 'detail'; tab = startTab || 'dash'; openPending = false; openUndeliv = false; onlyUndeliv = false;
  editingPerson = null; pSearch = '';
  shell(); renderNav();
  $('view').innerHTML = '<div class="card muted">กำลังโหลด...</div>';
  const { data, error } = await sb.from('drink_events').select('*').eq('id', id).single();
  if(error){ $('view').innerHTML = `<div class="err">${esc(error.message)}</div>`; return; }
  cur = data;
  await loadAll();
  subscribe();
  renderDetail();
}
function sortPeople(list){
  return list.slice().sort((a, b) =>
    ((!a.emp_id ? 1 : 0) - (!b.emp_id ? 1 : 0)) ||
    String(a.emp_id || '').localeCompare(String(b.emp_id || ''), 'th', { numeric: true }) ||
    String(a.full_name).localeCompare(String(b.full_name), 'th'));
}
async function loadAll(){
  const id = cur.id;
  const [pp, od, ev, sw, ex] = await Promise.all([
    sb.from('drink_people').select('*').eq('event_id', id),
    sb.from('drink_orders').select('*').eq('event_id', id).range(0, 9999),
    sb.from('drink_events').select('*').eq('id', id).single(),
    sb.from('drink_sweetness').select('*').order('sort').order('label'),
    sb.from('exam_sessions').select('id,title,batch').order('created_at', { ascending: false }),
  ]);
  people = sortPeople(pp.data || []);
  orders = od.data || [];
  if(ev.data) cur = ev.data;
  sweet = sw.data || [];
  examSessions = ex.data || [];
}
function subscribe(){
  channel = sb.channel('drink-' + cur.id)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'drink_orders', filter: 'event_id=eq.' + cur.id }, scheduleReload)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'drink_people', filter: 'event_id=eq.' + cur.id }, scheduleReload)
    .subscribe(st => { rtStatus = st === 'SUBSCRIBED' ? '🟢 Real time เชื่อมต่อแล้ว' : '🟡 กำลังเชื่อมต่อ Real time...'; const el = $('rt'); if(el) el.textContent = rtStatus; });
  pollTimer = setInterval(() => { if(tab === 'dash' && !document.hidden) scheduleReload(); }, 20000);   // สำรองเผื่อ Realtime หลุด
}
function scheduleReload(){
  clearTimeout(reloadTimer);
  reloadTimer = setTimeout(async () => { if(!cur) return; await loadAll(); if(tab === 'dash') renderTab(); }, 300);
}
function leaveEvent(){
  if(channel){ sb.removeChannel(channel); channel = null; }
  clearInterval(pollTimer); clearTimeout(reloadTimer); cur = null;
}

/* ===== แดชบอร์ด (รายวัน) ===== */
function curOrder(pid, d){
  return orders.filter(o => o.person_id === pid && o.order_date === d && !o.unlocked)
    .sort((a, b) => b.created_at.localeCompare(a.created_at))[0] || null;
}
function lastUnlocked(pid, d){
  return orders.filter(o => o.person_id === pid && o.order_date === d && o.unlocked)
    .sort((a, b) => b.created_at.localeCompare(a.created_at))[0] || null;
}
function sweetRank(label){ const i = sweet.findIndex(s => s.label === label); return i < 0 ? 999 : i; }
function comboKey(o){ return (o.temp || '') + '|' + (o.sweetness || ''); }
function comboLabel(k){ return k.split('|').filter(Boolean).join(' '); }
function comboRank(k){ const [t, s] = k.split('|'); return (t ? TEMPS.indexOf(t) + 1 : 0) * 1000 + sweetRank(s); }
function summaryRows(d){
  const m = new Map();
  people.forEach(p => {
    const o = curOrder(p.id, d); if(!o || o.skipped) return;
    const e = m.get(o.menu_name) || { name: o.menu_name, total: 0, sw: new Map() };
    e.total++; const k = comboKey(o); e.sw.set(k, (e.sw.get(k) || 0) + 1);
    m.set(o.menu_name, e);
  });
  return [...m.values()].sort((a, b) => b.total - a.total || a.name.localeCompare(b.name, 'th'));
}
function swEntries(e){ return [...e.sw.entries()].sort((a, b) => comboRank(a[0]) - comboRank(b[0])); }
function cupsList(d){ return people.map(p => ({ p, o: curOrder(p.id, d) })).filter(x => x.o && !x.o.skipped); }
function drinkText(o){
  return `<b>${esc(o.menu_name)}</b>${o.temp ? ' · ' + esc(o.temp) : ''}${o.sweetness ? ' · ' + esc(o.sweetness) : ''}`;
}
function dashHtml(){
  if(!people.length) return '<div class="card"><p class="muted">ยังไม่มีรายชื่อ ไปที่แท็บ "รายชื่อ" เพื่อนำเข้าจากการสอบหรือพิมพ์เพิ่ม</p></div>';
  const d = cur.order_date;
  const done = people.filter(p => curOrder(p.id, d));
  const pending = people.filter(p => !curOrder(p.id, d));
  const cl = cupsList(d);
  const skipped = done.length - cl.length;
  const gave = cl.filter(c => c.o.delivered).length;
  const undeliv = cl.filter(c => !c.o.delivered);
  const sum = summaryRows(d);

  let h = `<div class="card"><div class="daybar">
      <b>วันที่สั่ง</b><span>${esc(thaiDate(d))}</span><span class="muted">${d === todayStr ? '(วันนี้)' : d > todayStr ? '(ล่วงหน้า)' : '(ผ่านมาแล้ว)'}</span>
      <span style="flex:1"></span>
      <button class="btn ghost" onclick="openStickerDialog()">🖨 พิมพ์สติกเกอร์</button>
      <button class="btn ghost" onclick="copySummary()">📋 คัดลอกสรุปส่งร้าน</button>
      <button class="btn green" onclick="exportExcel()">⬇ Export Excel</button></div>
    <div class="stats">
      <div class="stat"><div class="n">${done.length}/${people.length}</div><div class="l">สั่งแล้ว (รวมไม่รับ)</div></div>
      <div class="stat"><div class="n" style="color:var(--blue)">${cl.length}</div><div class="l">จำนวนแก้วทั้งหมด</div></div>
      <div class="stat"><div class="n">${skipped}</div><div class="l">ไม่รับเครื่องดื่ม</div></div>
      <div class="stat click" onclick="openPending=!openPending;renderTab()"><div class="n" style="color:var(--red)">${pending.length}</div><div class="l">ยังไม่สั่ง (กดดูรายชื่อ)</div></div>
      <div class="stat click" onclick="openUndeliv=!openUndeliv;renderTab()"><div class="n" style="color:var(--green)">${gave}/${cl.length}</div><div class="l">แจกแล้ว (กดดูคนที่ยังไม่ได้รับ)</div></div>
    </div>`;
  if(openPending){
    h += `<h3>ยังไม่สั่ง (${pending.length})</h3>` + (pending.length ? '<div>' + pending.map(p => {
      const u = lastUnlocked(p.id, d);
      return `<span class="tag ${u ? 'wait' : 'gray'}" style="margin:2px">${esc(p.full_name)}${p.grp && p.grp !== 'ผู้เข้าอบรม' ? ' · ' + esc(p.grp) : ''}${u ? ' (รอสั่งใหม่)' : ''}</span>`;
    }).join('') + '</div>' : '<p class="muted">สั่งครบทุกคนแล้ว 🎉</p>');
  }
  if(openUndeliv){
    h += `<h3 style="margin-top:10px">ยังไม่ได้รับเครื่องดื่ม (${undeliv.length})</h3>` + (undeliv.length ? '<div>' + undeliv.map(c =>
      `<span class="tag wait" style="margin:2px">${esc(c.p.full_name)} · ${esc(c.o.menu_name)}${c.o.temp ? ' ' + esc(c.o.temp) : ''}</span>`).join('') + '</div>' : '<p class="muted">แจกครบทุกแก้วแล้ว 🎉</p>');
  }
  h += '</div>';

  h += `<div class="card"><h3>สรุปแต่ละเมนู</h3>` + (sum.length ?
    `<table><thead><tr><th>เมนู</th><th>แยกตามร้อน/เย็น · ความหวาน</th><th style="text-align:right">รวม (แก้ว)</th></tr></thead><tbody>` +
    sum.map(e => `<tr><td><b>${esc(e.name)}</b></td><td>${swEntries(e).map(([k, n]) => `<span class="chip">${comboLabel(k) ? esc(comboLabel(k)) : 'ไม่มีตัวเลือก'} × ${n}</span>`).join('')}</td><td style="text-align:right"><b>${e.total}</b></td></tr>`).join('') +
    `<tr><td colspan="2" style="text-align:right"><b>รวมทั้งหมด</b></td><td style="text-align:right"><b>${cl.length}</b></td></tr></tbody></table>`
    : '<p class="muted">ยังไม่มีผู้สั่ง</p>') + '</div>';

  const rows = onlyUndeliv ? people.filter(p => { const o = curOrder(p.id, d); return o && !o.skipped && !o.delivered; }) : people;
  h += `<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">ใครสั่งอะไร</h3>
      <label class="row"><input type="checkbox" ${onlyUndeliv ? 'checked' : ''} onchange="onlyUndeliv=this.checked;renderTab()"> แสดงเฉพาะแก้วที่ยังไม่แจก</label></div>
    <div style="overflow:auto;margin-top:8px"><table><thead><tr><th>รหัส</th><th>ชื่อ-นามสกุล</th><th>กลุ่ม</th><th>เครื่องดื่ม</th><th>หมายเหตุ</th><th>เวลา</th><th>แจกแล้ว</th><th></th></tr></thead><tbody>` +
    rows.map(p => {
      const o = curOrder(p.id, d), u = lastUnlocked(p.id, d);
      let what = '<span class="muted">—</span>';
      if(o) what = o.skipped ? '<span class="tag gray">ไม่รับเครื่องดื่ม</span>' : drinkText(o);
      else if(u) what = `<span class="tag wait">ปลดล็อกแล้ว (รอสั่งใหม่)</span>`;
      const chk = (o && !o.skipped) ? `<input type="checkbox" ${o.delivered ? 'checked' : ''} onchange="toggleDelivered('${esc(o.id)}',this.checked)" style="width:20px;height:20px">` : '';
      return `<tr ${o && o.delivered ? 'style="background:#f0faf4"' : ''}><td>${esc(p.emp_id || '')}</td><td>${esc(p.full_name)}</td><td>${esc(p.grp)}</td><td>${what}</td><td>${o ? esc(o.note) : ''}</td><td>${o ? fmtHM(o.created_at) : ''}</td><td style="text-align:center">${chk}</td>
        <td>${o ? `<button class="btn red sm" onclick="unlockOrder('${esc(o.id)}')">ปลดล็อก</button>` : ''}</td></tr>`;
    }).join('') + '</tbody></table>' + (rows.length ? '' : '<p class="muted">ไม่มีรายการ</p>') + '</div></div>';
  return h;
}

async function toggleDelivered(oid, v){
  const o = orders.find(x => x.id === oid); if(!o) return;
  const at = v ? new Date().toISOString() : null;
  o.delivered = v; o.delivered_at = at; renderTab();          // แสดงผลทันที แล้วค่อยบันทึก
  const { error } = await sb.from('drink_orders').update({ delivered: v, delivered_at: at }).eq('id', oid);
  if(error){ toast('บันทึกไม่สำเร็จ: ' + error.message); await loadAll(); renderTab(); }
}

async function unlockOrder(oid){
  const o = orders.find(x => x.id === oid); if(!o) return;
  const p = people.find(x => x.id === o.person_id);
  if(!confirm(`ปลดล็อกการสั่งของ ${p ? p.full_name : ''} (${o.menu_name}) ให้สั่งใหม่?\n(รายการเดิมยังเก็บไว้ในประวัติ)`)) return;
  const { error } = await sb.from('drink_orders').update({ unlocked: true }).eq('id', oid);
  if(error){ toast('ผิดพลาด: ' + error.message); return; }
  toast('ปลดล็อกแล้ว'); await loadAll(); renderTab();
}

function summaryText(){
  const d = cur.order_date, sum = summaryRows(d);
  const cups = sum.reduce((s, e) => s + e.total, 0);
  const lines = [`🥤 สั่งเครื่องดื่ม ${cur.title}`, 'วันที่ ' + thaiDate(d), ''];
  sum.forEach(e => swEntries(e).forEach(([k, n]) => lines.push(`${e.name}${comboLabel(k) ? ' ' + comboLabel(k) : ''} x${n}`)));
  lines.push('', `รวม ${cups} แก้ว`);
  const notes = [];
  people.forEach(p => { const o = curOrder(p.id, d); if(o && !o.skipped && o.note) notes.push(`- ${p.full_name}: ${o.menu_name}${comboLabel(comboKey(o)) ? ' ' + comboLabel(comboKey(o)) : ''} (${o.note})`); });
  if(notes.length){ lines.push('', 'หมายเหตุ:'); lines.push(...notes); }
  return lines.join('\n');
}
async function copySummary(){
  const t = summaryText();
  try { await navigator.clipboard.writeText(t); toast('คัดลอกสรุปแล้ว'); }
  catch(e){
    const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('คัดลอกสรุปแล้ว'); } catch(_){ toast('คัดลอกไม่สำเร็จ'); }
    ta.remove();
  }
}

/* ===== พิมพ์สติกเกอร์แปะแก้ว ===== */
function openStickerDialog(){
  const n = cupsList(cur.order_date).length;
  if(!n){ toast('ยังไม่มีแก้วให้พิมพ์'); return; }
  const m = document.createElement('div'); m.className = 'modal'; m.id = 'stkModal'; m.onclick = e => { if(e.target === m) m.remove(); };
  m.innerHTML = `<div class="box" style="max-width:420px"><h2>พิมพ์สติกเกอร์แปะแก้ว</h2>
    <p class="muted">ทั้งหมด ${n} แก้ว · 1 แก้ว 1 ใบ แสดงชื่อ เมนู ร้อน/เย็น ความหวาน และหมายเหตุ · พิมพ์ลงกระดาษ A4 ธรรมดาแล้วตัดตามเส้นประ หรือพิมพ์ลงกระดาษสติกเกอร์</p>

    <label class="row" style="margin-top:10px"><input type="checkbox" id="stk_und"> เฉพาะแก้วที่ยังไม่แจก</label>
    <div class="row" style="margin-top:14px"><button class="btn green" onclick="printStickers()">🖨 พิมพ์</button><button class="btn ghost" onclick="$('stkModal').remove()">ยกเลิก</button></div></div>`;
  document.body.appendChild(m);
}
function printStickers(){
  const cols = parseInt($('stk_cols').value) || 3, sort = $('stk_sort').value, und = $('stk_und').checked;
  let cups = cupsList(cur.order_date);
  if(und) cups = cups.filter(c => !c.o.delivered);
  if(!cups.length){ toast('ไม่มีแก้วที่ตรงเงื่อนไข'); return; }
  if(sort === 'menu') cups.sort((a, b) => a.o.menu_name.localeCompare(b.o.menu_name, 'th') || comboRank(comboKey(a.o)) - comboRank(comboKey(b.o)) || people.indexOf(a.p) - people.indexOf(b.p));
  let pa = $('printArea');
  if(!pa){ pa = document.createElement('div'); pa.id = 'printArea'; document.body.appendChild(pa); }
  pa.innerHTML = `<div class="stkgrid" style="grid-template-columns:repeat(${cols},1fr)">` + cups.map(({ p, o }) =>
    `<div class="stk"><div class="n">${esc(p.full_name)}</div><div class="m">${esc(o.menu_name)}${o.temp ? ' · ' + esc(o.temp) : ''}</div>` +
    (o.sweetness ? `<div class="s">${esc(o.sweetness)}</div>` : '') + (o.note ? `<div class="t">${esc(o.note)}</div>` : '') +
    `<div class="g">${[p.emp_id, p.grp !== 'ผู้เข้าอบรม' ? p.grp : ''].filter(Boolean).map(esc).join(' · ')}</div></div>`).join('') + '</div>';
  const mm = $('stkModal'); if(mm) mm.remove();
  window.print();
}
window.addEventListener('afterprint', () => { const pa = $('printArea'); if(pa) pa.innerHTML = ''; });

function exportExcel(){
  const d = cur.order_date, wb = XLSX.utils.book_new();
  const sum = summaryRows(d), cups = sum.reduce((s, e) => s + e.total, 0);
  const a1 = [['เมนู', 'ร้อน/เย็น', 'ระดับความหวาน', 'จำนวน (แก้ว)']];
  sum.forEach(e => swEntries(e).forEach(([k, n]) => { const [t, s] = k.split('|'); a1.push([e.name, t, s, n]); }));
  a1.push(['รวมทั้งหมด', '', '', cups]);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(a1), 'สรุปเมนู');

  const a2 = [['รหัสพนักงาน', 'ชื่อ-นามสกุล', 'กลุ่ม', 'สังกัด', 'สถานะ', 'เครื่องดื่ม', 'ร้อน/เย็น', 'ความหวาน', 'หมายเหตุ', 'เวลาสั่ง', 'แจกแล้ว']];
  people.forEach(p => {
    const o = curOrder(p.id, d);
    a2.push([p.emp_id || '', p.full_name, p.grp, p.unit, o ? (o.skipped ? 'ไม่รับ' : 'สั่งแล้ว') : 'ยังไม่สั่ง',
      o && !o.skipped ? o.menu_name : '', o ? (o.temp || '') : '', o ? (o.sweetness || '') : '', o ? o.note : '', o ? fmtHM(o.created_at) : '',
      o && !o.skipped ? (o.delivered ? 'แจกแล้ว' : 'ยังไม่แจก') : '']);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(a2), 'รายคน ' + d);

  const pmap = new Map(people.map(p => [p.id, p]));
  const a3 = [['วันที่', 'รหัสพนักงาน', 'ชื่อ-นามสกุล', 'กลุ่ม', 'เครื่องดื่ม', 'ร้อน/เย็น', 'ความหวาน', 'หมายเหตุ', 'ไม่รับ', 'แจกแล้ว', 'ปลดล็อกแล้ว', 'เวลา']];
  orders.slice().sort((a, b) => a.order_date.localeCompare(b.order_date) || a.created_at.localeCompare(b.created_at)).forEach(o => {
    const p = pmap.get(o.person_id) || {};
    a3.push([o.order_date, p.emp_id || '', p.full_name || '', p.grp || '', o.skipped ? '' : o.menu_name, o.temp || '', o.sweetness || '', o.note, o.skipped ? 'ใช่' : '', o.delivered ? 'ใช่' : '', o.unlocked ? 'ใช่' : '', fmtT(o.created_at)]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(a3), 'ประวัติทุกครั้ง');
  XLSX.writeFile(wb, `สั่งน้ำ_${cur.title}_${d}.xlsx`.replace(/[\\/:*?"<>|]/g, '_'));
}

function peopleTable(list){
  if(!people.length) return '<p class="muted">ยังไม่มีรายชื่อ</p>';
  if(!list.length) return '<p class="muted">ไม่พบรายชื่อที่ค้นหา</p>';
  return `<table><thead><tr><th>รหัส</th><th>ชื่อ-นามสกุล</th><th>สังกัด</th><th>กลุ่ม</th><th></th></tr></thead><tbody>` +

function renderPeopleList(){
  const q = pSearch.trim().toLowerCase();
  $('plist').innerHTML = peopleTable(people.filter(p => !q || p.full_name.toLowerCase().includes(q) || (p.emp_id || '').toLowerCase().includes(q) || (p.grp || '').toLowerCase().includes(q)));
}
function fillPersonForm(){
  if(!editingPerson) return;
  const p = people.find(x => x.id === editingPerson); if(!p){ editingPerson = null; return; }
  $('pf_name').value = p.full_name; $('pf_id').value = p.emp_id || ''; $('pf_unit').value = p.unit; $('pf_grp').value = p.grp;
  $('pf_title').textContent = 'แก้ไขรายชื่อ'; $('pf_btn').textContent = 'บันทึกการแก้ไข'; $('pf_cancel').classList.remove('hide');
}
function editPerson(id){ editingPerson = id; renderTab(); window.scrollTo(0, 0); }
function cancelEditPerson(){ editingPerson = null; renderTab(); }
async function savePerson(){
  const name = $('pf_name').value.trim();
  if(!name){ toast('กรุณาใส่ชื่อ'); return; }
  const row = { full_name: name, emp_id: $('pf_id').value.trim() || null, unit: $('pf_unit').value.trim(), grp: $('pf_grp').value.trim() || 'ผู้เข้าอบรม' };
  let r;
  if(editingPerson) r = await sb.from('drink_people').update(row).eq('id', editingPerson);
  else r = await sb.from('drink_people').insert({ ...row, event_id: cur.id });
  if(r.error){ toast((r.error.message || '').includes('duplicate') || (r.error.code === '23505') ? 'รหัสนี้มีอยู่แล้วในรายการ' : 'ผิดพลาด: ' + r.error.message); return; }
  toast(editingPerson ? 'บันทึกแล้ว' : 'เพิ่มแล้ว'); editingPerson = null;
  await loadAll(); renderTab();
}
async function delPerson(id){
  const p = people.find(x => x.id === id);
  if(!confirm(`ลบ ${p ? p.full_name : ''} ? (ประวัติการสั่งของคนนี้จะถูกลบด้วย)`)) return;
  const { error } = await sb.from('drink_people').delete().eq('id', id);
  if(error){ toast('ผิดพลาด: ' + error.message); return; }
  await loadAll(); renderTab();
}
async function importFromExam(){
  const sid = $('imp_s').value;
  if(!sid){ toast('กรุณาเลือกการสอบ'); return; }
  const { data, error } = await sb.from('exam_participants').select('emp_id,full_name,unit').eq('session_id', sid);
  if(error){ toast('ผิดพลาด: ' + error.message); return; }
  if(!data || !data.length){ toast('การสอบนี้ยังไม่มีรายชื่อ'); return; }
  const before = people.length;
  const rows = data.map(x => ({ event_id: cur.id, emp_id: x.emp_id, full_name: x.full_name, unit: x.unit || '', grp: 'ผู้เข้าอบรม' }));
  const r = await sb.from('drink_people').upsert(rows, { onConflict: 'event_id,emp_id', ignoreDuplicates: true });
  if(r.error){ toast('ผิดพลาด: ' + r.error.message); return; }
  await loadAll(); renderTab();
  toast(`นำเข้า ${data.length} คน (เพิ่มใหม่ ${people.length - before} คน)`);
}

async function setOpen(v){
  const { error } = await sb.from('drink_events').update({ is_open: v }).eq('id', cur.id);
  if(error){ toast('ผิดพลาด: ' + error.message); return; }
  cur.is_open = v; toast('บันทึกแล้ว'); renderDetail();
}
async function saveCloseAt(){
  const v = $('s_close').value;
  if(!v){ toast('กรุณาเลือกวันและเวลา'); return; }
  const { error } = await sb.from('drink_events').update({ close_at: fromBkkLocal(v) }).eq('id', cur.id);
  if(error){ toast('ผิดพลาด: ' + error.message); return; }
  cur.close_at = fromBkkLocal(v); toast('ตั้งเวลาปิดรับสั่งแล้ว'); renderDetail();
}
async function clearCloseAt(){
  const { error } = await sb.from('drink_events').update({ close_at: null }).eq('id', cur.id);
  if(error){ toast('ผิดพลาด: ' + error.message); return; }
  cur.close_at = null; toast('ล้างเวลาปิดแล้ว'); renderDetail();
}
async function saveDate(){
  const v = $('s_date').value;
  if(!v){ toast('กรุณาเลือกวันที่'); return; }
  if(v === cur.order_date){ toast('เป็นวันที่เดิมอยู่แล้ว'); return; }
  const old = cur.order_date;
  if(orders.length && !confirm(`เปลี่ยนวันที่เป็น ${thaiDate(v, 'medium')} ?\nคำสั่งซื้อที่มีอยู่ ${orders.length} รายการจะย้ายไปวันที่ใหม่ด้วย`)) return;
  if(orders.length){
    const r = await sb.from('drink_orders').update({ order_date: v }).eq('event_id', cur.id);
    if(r.error){ toast('ย้ายคำสั่งซื้อไม่สำเร็จ ยังไม่เปลี่ยนวันที่: ' + r.error.message); return; }
  }
  const { error } = await sb.from('drink_events').update({ order_date: v }).eq('id', cur.id);
  if(error){
    if(orders.length) await sb.from('drink_orders').update({ order_date: old }).eq('event_id', cur.id);   // ย้อนกลับ
    toast('ผิดพลาด: ' + error.message); return;
  }
  toast('เปลี่ยนวันที่แล้ว'); await loadAll(); renderDetail();
}
async function saveTitle(){

  const label = $('sw_edit').value.trim(); if(!label){ toast('ชื่อห้ามว่าง'); return; }
  const { error } = await sb.from('drink_sweetness').update({ label }).eq('id', id);
  if(error){ toast((error.code === '23505' || (error.message || '').includes('duplicate')) ? 'มีระดับนี้อยู่แล้ว' : 'ผิดพลาด: ' + error.message); return; }
  editingSweet = null; await loadMenu(); renderMenuAdmin();
}
async function delSweet(id){
  const s = sweet.find(x => x.id === id);
  if(!confirm(`ลบระดับความหวาน "${s ? s.label : ''}" ? (ประวัติเดิมยังแสดงชื่อเดิม)`)) return;
  const { error } = await sb.from('drink_sweetness').delete().eq('id', id);
  if(error){ toast('ผิดพลาด: ' + error.message); return; }
  await loadMenu(); renderMenuAdmin();
}
async function moveItem(table, list, i, d){
  const j = i + d; if(j < 0 || j >= list.length) return;
  const arr = list.slice(); [arr[i], arr[j]] = [arr[j], arr[i]];
  await Promise.all(arr.map((x, k) => x.sort === k + 1 ? null : sb.from(table).update({ sort: k + 1 }).eq('id', x.id)).filter(Boolean));
  await loadMenu(); renderMenuAdmin();
}

boot();
</script>
